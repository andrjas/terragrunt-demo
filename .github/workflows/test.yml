name: Test Terraform and Terragrunt

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  terraform-problems-test:
    name: Test Terraform Problems (Without Terragrunt)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
        module: [network, app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init - ${{ matrix.environment }}/${{ matrix.module }}
        working-directory: terraform-problems/${{ matrix.environment }}/${{ matrix.module }}
        run: terraform init

      - name: Terraform Validate - ${{ matrix.environment }}/${{ matrix.module }}
        working-directory: terraform-problems/${{ matrix.environment }}/${{ matrix.module }}
        run: terraform validate

      - name: Terraform Plan - ${{ matrix.environment }}/${{ matrix.module }}
        working-directory: terraform-problems/${{ matrix.environment }}/${{ matrix.module }}
        run: terraform plan

      - name: Terraform Apply - ${{ matrix.environment }}/${{ matrix.module }}
        working-directory: terraform-problems/${{ matrix.environment }}/${{ matrix.module }}
        run: terraform apply -auto-approve

      - name: Verify outputs exist
        working-directory: terraform-problems/${{ matrix.environment }}/${{ matrix.module }}
        run: |
          if [ -d "outputs" ]; then
            echo "Outputs directory created successfully"
            ls -la outputs/
          else
            echo "Warning: outputs directory not found"
          fi

  terragrunt-solution-test:
    name: Test Terragrunt Solution
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.54.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt Init All - ${{ matrix.environment }}
        working-directory: terragrunt-solution/environments/${{ matrix.environment }}
        run: terragrunt run-all init --terragrunt-non-interactive

      - name: Terragrunt Validate All - ${{ matrix.environment }}
        working-directory: terragrunt-solution/environments/${{ matrix.environment }}
        run: terragrunt run-all validate --terragrunt-non-interactive

      - name: Terragrunt Plan All - ${{ matrix.environment }}
        working-directory: terragrunt-solution/environments/${{ matrix.environment }}
        run: terragrunt run-all plan --terragrunt-non-interactive

      - name: Terragrunt Apply All - ${{ matrix.environment }}
        working-directory: terragrunt-solution/environments/${{ matrix.environment }}
        run: terragrunt run-all apply --terragrunt-non-interactive --terragrunt-log-level info

      - name: Verify dependency order
        working-directory: terragrunt-solution/environments/${{ matrix.environment }}
        run: |
          echo "Checking that network was created before app..."
          if [ -f "network/terraform.tfstate" ] && [ -f "app/terraform.tfstate" ]; then
            echo "Both modules created state files successfully"
          else
            echo "Error: State files not created"
            exit 1
          fi

      - name: Verify outputs
        working-directory: terragrunt-solution/environments/${{ matrix.environment }}
        run: |
          echo "Network outputs:"
          cd network
          terragrunt output --terragrunt-non-interactive
          cd ../app
          echo "App outputs:"
          terragrunt output --terragrunt-non-interactive

      - name: Test run-all destroy
        working-directory: terragrunt-solution/environments/${{ matrix.environment }}
        run: terragrunt run-all destroy --terragrunt-non-interactive

  compare-results:
    name: Compare Terraform vs Terragrunt
    runs-on: ubuntu-latest
    needs: [terraform-problems-test, terragrunt-solution-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Count files in Terraform approach
        id: terraform-count
        run: |
          echo "Counting Terraform files..."
          TERRAFORM_FILES=$(find terraform-problems -name "*.tf" -o -name "*.tfvars" | wc -l)
          echo "terraform_files=$TERRAFORM_FILES" >> $GITHUB_OUTPUT
          echo "Terraform approach uses $TERRAFORM_FILES files"

      - name: Count files in Terragrunt approach
        id: terragrunt-count
        run: |
          echo "Counting Terragrunt files..."
          TERRAGRUNT_TF_FILES=$(find terragrunt-solution/modules -name "*.tf" | wc -l)
          TERRAGRUNT_HCL_FILES=$(find terragrunt-solution -name "terragrunt.hcl" | wc -l)
          TOTAL=$((TERRAGRUNT_TF_FILES + TERRAGRUNT_HCL_FILES))
          echo "terragrunt_files=$TOTAL" >> $GITHUB_OUTPUT
          echo "Terragrunt approach uses $TERRAGRUNT_TF_FILES .tf files + $TERRAGRUNT_HCL_FILES .hcl files = $TOTAL files"

      - name: Show comparison
        run: |
          echo "## Comparison Results"
          echo "- **Terraform-only approach**: ${{ steps.terraform-count.outputs.terraform_files }} files"
          echo "- **Terragrunt approach**: ${{ steps.terragrunt-count.outputs.terragrunt_files }} files"
          echo ""
          echo "The Terragrunt approach demonstrates DRY principles by reusing shared modules!"

  integration-test:
    name: Integration Test - Full Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.54.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Deploy all environments with Terragrunt
        working-directory: terragrunt-solution/environments
        run: |
          echo "Testing deployment of all environments..."
          for env in dev staging prod; do
            echo "Deploying $env environment..."
            cd $env
            terragrunt run-all apply --terragrunt-non-interactive
            cd ..
          done

      - name: Verify all deployments
        working-directory: terragrunt-solution/environments
        run: |
          echo "Verifying all deployments..."
          for env in dev staging prod; do
            echo "Checking $env environment..."
            if [ -f "$env/network/terraform.tfstate" ] && [ -f "$env/app/terraform.tfstate" ]; then
              echo "✓ $env environment deployed successfully"
            else
              echo "✗ $env environment deployment failed"
              exit 1
            fi
          done

      - name: Test dependency outputs
        working-directory: terragrunt-solution/environments/dev/app
        run: |
          echo "Testing that app receives network outputs..."
          terragrunt output --terragrunt-non-interactive

      - name: Cleanup all environments
        if: always()
        working-directory: terragrunt-solution/environments
        run: |
          for env in dev staging prod; do
            echo "Destroying $env environment..."
            cd $env
            terragrunt run-all destroy --terragrunt-non-interactive || true
            cd ..
          done
